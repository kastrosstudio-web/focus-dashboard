<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Timers | Minimalist Pomodoro & Ambient Sound Dashboard</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="Minimalist Pomodoro odak sayacı ve katmanlı ortam sesi mikseri. Yağmur ve kahve dükkanı atmosferiyle dikkat dağıtıcı unsurlar olmadan çalışın.">
  <meta name="keywords" content="study timer, pomodoro timer, odaklanma sayacı, ambient sound mixer, ders çalışma sayacı, deep work">
  <meta property="og:title" content="Study Timers — Deep Focus & Ambient Sounds">
  <meta property="og:description" content="Minimalist tasarım, tek görev modu ve katmanlı ortam sesleri ile derin odaklanma.">
  <meta property="og:url" content="https://studytimers.netlify.app">
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg: #0f1115;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e6e8ec;
      --text-muted: #8b92a0;
      --accent: #5e6ad2;
      --accent-hover: #717ce0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #171b24, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Single Focus Task */
    .focus-task {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
    }

    .focus-task input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.95rem;
      text-align: center;
    }

    .focus-task input::placeholder {
      color: var(--text-muted);
    }

    /* Timer Card */
    .timer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 24px;
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .mode-pills {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .mode-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-color: var(--border);
    }

    .timer-display {
      font-size: 4.8rem;
      font-weight: 200;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    /* Ambient Mixer Card */
    .mixer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mixer-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .sound-track {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sound-label {
      font-size: 0.9rem;
      width: 100px;
    }

    .sound-track input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .toggle-sound {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      min-width: 55px;
    }

    .toggle-sound.on {
      background: rgba(94, 106, 210, 0.2);
      border-color: var(--accent);
      color: #fff;
    }

    footer {
      margin-top: 10px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Study Timers</h1>
    </header>

    <!-- Tek Görev Alanı -->
    <div class="focus-task">
      <input type="text" placeholder="Şu an neye odaklanıyorsun?" spellcheck="false">
    </div>

    <!-- Pomodoro Paneli -->
    <div class="timer-card">
      <div class="mode-pills">
        <button class="mode-btn active" data-time="1500">Odaklan (25m)</button>
        <button class="mode-btn" data-time="300">Kısa Mola (5m)</button>
        <button class="mode-btn" data-time="900">Uzun Mola (15m)</button>
      </div>

      <div class="timer-display" id="time">25:00</div>

      <div class="controls">
        <button class="btn btn-primary" id="start-btn">Başlat</button>
        <button class="btn btn-secondary" id="reset-btn">Sıfırla</button>
      </div>
    </div>

    <!-- Katmanlı Ortam Sesi Mikseri -->
    <div class="mixer-card">
      <div class="mixer-title">Ambient Mixer</div>

      <!-- Yağmur -->
      <div class="sound-track">
        <span class="sound-label">🌧️ Yağmur</span>
        <input type="range" id="rain-vol" min="0" max="1" step="0.05" value="0.5">
        <button class="toggle-sound" id="rain-btn">Aç</button>
      </div>

      <!-- Derin Odak / Brown Noise -->
      <div class="sound-track">
        <span class="sound-label">🌊 Derin Odak</span>
        <input type="range" id="brown-vol" min="0" max="1" step="0.05" value="0.5">
        <button class="toggle-sound" id="brown-btn">Aç</button>
      </div>
    </div>

    <footer>
      <p>Kastros Studio &copy; Minimalist Focus Experience</p>
    </footer>
  </div>

  <script>
    // Timer Logic
    let totalSeconds = 1500;
    let initialSeconds = 1500;
    let timerInterval = null;
    let isRunning = false;

    const display = document.getElementById('time');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const modeBtns = document.querySelectorAll('.mode-btn');

    function updateDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      document.title = `${display.textContent} – Study Timers`;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        startBtn.textContent = 'Devam Et';
        isRunning = false;
      } else {
        isRunning = true;
        startBtn.textContent = 'Durdur';
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = 'Başlat';
            alert('Süre doldu! Mola vakti.');
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      totalSeconds = initialSeconds;
      startBtn.textContent = 'Başlat';
      updateDisplay();
    }

    startBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        initialSeconds = parseInt(btn.dataset.time);
        resetTimer();
      });
    });

    // Web Audio Synthesizer (Zero-file ambient sounds)
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function createNoiseNode(type) {
      const ctx = getAudioContext();
      const bufferSize = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let lastOut = 0.0;

      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        if (type === 'brown') {
          data[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = data[i];
          data[i] *= 3.5;
        } else {
          // Rain simulation (pinkish bandpass)
          data[i] = white * 0.4;
        }
      }

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const gain = ctx.createGain();
      gain.gain.value = 0;

      noise.connect(gain);
      gain.connect(ctx.destination);
      noise.start();

      return { noise, gain };
    }

    let rainAudio = null;
    let brownAudio = null;

    // Rain Controller
    const rainBtn = document.getElementById('rain-btn');
    const rainVol = document.getElementById('rain-vol');
    rainBtn.addEventListener('click', () => {
      if (!rainAudio) rainAudio = createNoiseNode('rain');
      if (rainBtn.classList.contains('on')) {
        rainAudio.gain.gain.value = 0;
        rainBtn.classList.remove('on');
        rainBtn.textContent = 'Aç';
      } else {
        rainAudio.gain.gain.value = rainVol.value;
        rainBtn.classList.add('on');
        rainBtn.textContent = 'Kapat';
      }
    });
    rainVol.addEventListener('input', (e) => {
      if (rainAudio && rainBtn.classList.contains('on')) {
        rainAudio.gain.gain.value = e.target.value;
      }
    });

    // Brown Noise Controller
    const brownBtn = document.getElementById('brown-btn');
    const brownVol = document.getElementById('brown-vol');
    brownBtn.addEventListener('click', () => {
      if (!brownAudio) brownAudio = createNoiseNode('brown');
      if (brownBtn.classList.contains('on')) {
        brownAudio.gain.gain.value = 0;
        brownBtn.classList.remove('on');
        brownBtn.textContent = 'Aç';
      } else {
        brownAudio.gain.gain.value = brownVol.value;
        brownBtn.classList.add('on');
        brownBtn.textContent = 'Kapat';
      }
    });
    brownVol.addEventListener('input', (e) => {
      if (brownAudio && brownBtn.classList.contains('on')) {
        brownAudio.gain.gain.value = e.target.value;
      }
    });
  </script>
</body>
</html>
